name: Dependency PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-dependency-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Information
        run: |
          echo "Workflow triggered by: ${{ github.actor }}"
          echo "Event type: ${{ github.event_name }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Manual trigger: ${{ github.event_name == 'workflow_dispatch' }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for package.json
        id: check_package
        run: |
          if [ -f "package.json" ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
            echo "✅ package.json found"
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "❌ package.json not found"
          fi

      - name: Install dependencies
        if: steps.check_package.outputs.has_package == 'true'
        run: |
          echo "Installing dependencies..."
          npm install
          echo "✅ Dependencies installed successfully"

      - name: Skip installation (no package.json)
        if: steps.check_package.outputs.has_package == 'false'
        run: |
          echo "📝 No package.json found - skipping dependency installation"

      - name: Run tests
        if: steps.check_package.outputs.has_package == 'true'
        run: |
          echo "Checking for test script..."
          if npm run | grep -q "test"; then
            echo "Running tests..."
            npm test
            echo "✅ Tests completed"
          else
            echo "📝 No test script found in package.json"
          fi

      - name: Build check
        if: steps.check_package.outputs.has_package == 'true'
        run: |
          echo "Checking for build script..."
          if npm run | grep -q "build"; then
            echo "Running build..."
            npm run build
            echo "✅ Build completed successfully"
          else
            echo "📝 No build script found"
          fi

      - name: Final Success Message
        run: |
          echo "🎉 Dependency check completed successfully!"
          echo "All validations passed for this PR"
