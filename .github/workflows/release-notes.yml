name: Custom Workflow – Generate Release Notes

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-release-notes:
    name: Generate and Publish Release Notes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      id: notes
      uses: actions/github-script@v7
      with:
        script: |
          const commits = github.context.payload.commits || [];
          const actor = github.context.actor;
          const date = new Date().toLocaleString("en-GB");

          let notes = `## 🚀 Heavens Above – Automated Release Notes\n`;
          notes += `**Date:** ${date}\n`;
          notes += `**Triggered by:** ${actor}\n\n`;
          notes += `### 🧾 Summary of Changes:\n`;

          if (commits.length > 0) {
            notes += commits.map(c => `- ${c.message} (${c.id.slice(0,7)})`).join('\n');
          } else {
            notes += "No new commits detected.";
          }

          notes += `\n\n---\n_Generated automatically by GitHub Actions_`;

          core.setOutput("body", notes);

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.run_number }}
        name: "Release v${{ github.run_number }}"
        body: ${{ steps.notes.outputs.body }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Log Completion
      run: echo "✅ Release notes generated successfully on ${{ steps.date.outputs.date }}"
