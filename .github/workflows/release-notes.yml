name: Custom Workflow – Generate Release Notes

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Triggers when a new version tag is pushed (like v1.0.0)
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write  # Required to create releases and write release notes

jobs:
  generate-release-notes:
    name: Generate and Publish Release Notes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      id: notes
      uses: actions/github-script@v7
      with:
        script: |
          const { context, github } = require('@actions/github');
          
          // Get commit messages
          const commits = context.payload.commits || [];
          const commitMessages = commits.map(c => `- ${c.message} (${c.id.slice(0,7)})`).join('\n');

          // Create formatted release notes
          const releaseNotes = `
          ## 🚀 Heavens Above – Automated Release Notes
          **Date:** ${process.env.DATE || new Date().toLocaleString()}
          **Triggered by:** ${context.actor}

          ### 🧾 Summary of Changes:
          ${commitMessages || 'No new commits detected.'}

          ---
          _Generated automatically by GitHub Actions_
          `;

          core.setOutput("body", releaseNotes);

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.run_number }}
        name: "Release v${{ github.run_number }}"
        body: ${{ steps.notes.outputs.body }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Log Completion
      run: echo "✅ Release notes generated and published successfully on ${{ steps.date.outputs.date }}"
