name: Custom Workflow – Generate and Publish Release Notes

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-release-notes:
    name: Generate and Publish Release Notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            const actor = context.actor || "unknown user";
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const tag = context.ref.replace("refs/tags/", "") || `v${context.runNumber}`;
            const date = new Date().toISOString();

            let notes = `## 🚀 Heavens Above – Automated Release Notes\n`;
            notes += `**Repository:** ${owner}/${repo}\n`;
            notes += `**Date:** ${date}\n`;
            notes += `**Triggered by:** ${actor}\n\n`;
            notes += `### 🧾 Summary of Changes:\n`;

            if (commits.length > 0) {
              for (const c of commits) {
                notes += `- ${c.message} (${c.id.substring(0,7)})\n`;
              }
            } else {
              notes += "No commit data found in this push.\n";
            }

            notes += `\n---\n_Automatically generated by GitHub Actions_`;
            core.setOutput("body", notes);

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: ${{ steps.generate.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log completion
        run: echo "✅ Successfully generated and published release notes."
