name: Automated Release Notes Generator

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate notes for'
        required: true
        default: 'v1.0.0'
      previous_version:
        description: 'Previous version to compare against'
        required: false

env:
  NODE_VERSION: '18.x'

jobs:
  generate-release-notes:
    name: Generate Smart Release Notes
    runs-on: ubuntu-latest
    
    outputs:
      release_notes: ${{ steps.generate_notes.outputs.notes }}
      changelog_file: ${{ steps.generate_notes.outputs.changelog_path }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Generate Smart Release Notes
      id: generate_notes
      run: |
        # Determine versions
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          CURRENT_VERSION="${{ github.event.inputs.version }}"
          PREVIOUS_VERSION="${{ github.event.inputs.previous_version }}"
        else
          CURRENT_VERSION="${GITHUB_REF#refs/tags/}"
          # Auto-detect previous version
          PREVIOUS_VERSION=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        fi

        echo "Current Version: $CURRENT_VERSION"
        echo "Previous Version: $PREVIOUS_VERSION"

        # Get commit range
        if [ -z "$PREVIOUS_VERSION" ]; then
          COMMIT_RANGE="HEAD"
          echo "No previous tag found, analyzing all commits"
        else
          COMMIT_RANGE="$PREVIOUS_VERSION..HEAD"
          echo "Analyzing commits from $PREVIOUS_VERSION to $CURRENT_VERSION"
        fi

        # Categorize commits using conventional commit format
        FEATURES=$(git log "$COMMIT_RANGE" --oneline --grep="^feat" --format="- %s" | sed 's/^feat(:)*//i' || echo "None")
        FIXES=$(git log "$COMMIT_RANGE" --oneline --grep="^fix" --format="- %s" | sed 's/^fix(:)*//i' || echo "None")
        DOCS=$(git log "$COMMIT_RANGE" --oneline --grep="^docs" --format="- %s" | sed 's/^docs(:)*//i' || echo "None")
        CHORES=$(git log "$COMMIT_RANGE" --oneline --grep="^chore" --format="- %s" | sed 's/^chore(:)*//i' || echo "None")
        BREAKING_CHANGES=$(git log "$COMMIT_RANGE" --oneline --grep="BREAKING CHANGE" --format="- %s" || echo "None")

        # Get contributors
        CONTRIBUTORS=$(git log "$COMMIT_RANGE" --format="%aN" | sort -u | awk '{print "- " $0}' || echo "None")

        # Count statistics
        TOTAL_COMMITS=$(git rev-list --count "$COMMIT_RANGE" 2>/dev/null || echo "N/A")
        FEATURE_COUNT=$(echo "$FEATURES" | grep -c "- " || echo 0)
        FIX_COUNT=$(echo "$FIXES" | grep -c "- " || echo 0)

        # Generate release notes
        cat > release_notes.md << EOF
        # Release $CURRENT_VERSION

        ## 📊 Release Overview
        - **Total Changes**: $TOTAL_COMMITS commits
        - **New Features**: $FEATURE_COUNT
        - **Bug Fixes**: $FIX_COUNT
        - **Generated**: $(date +"%Y-%m-%d %H:%M:%S")
        - **Workflow**: [$GITHUB_WORKFLOW]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

        ## 🚀 What's New

        ### ✨ Features
        $FEATURES

        ### 🐛 Bug Fixes
        $FIXES

        ### 📚 Documentation
        $DOCS

        ### 🔧 Maintenance
        $CHORES

        ### 💥 Breaking Changes
        $BREAKING_CHANGES

        ## 👥 Contributors
        $CONTRIBUTORS

        ## 🔗 Links
        - **Repository**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
        - **Compare Changes**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS_VERSION...$CURRENT_VERSION

        ---
        *Automatically generated by GitHub Actions*
        EOF

        # Update CHANGELOG.md
        if [ -f "CHANGELOG.md" ]; then
          echo "Updating existing CHANGELOG.md"
          cat release_notes.md > temp_changelog.md
          echo "" >> temp_changelog.md
          tail -n +2 CHANGELOG.md >> temp_changelog.md
          mv temp_changelog.md CHANGELOG.md
        else
          echo "Creating new CHANGELOG.md"
          cp release_notes.md CHANGELOG.md
        fi

        echo "notes=$(cat release_notes.md | jq -R -s -c .)" >> $GITHUB_OUTPUT
        echo "changelog_path=CHANGELOG.md" >> $GITHUB_OUTPUT

        echo "✅ Release notes generated successfully!"

    - name: Upload Release Notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes-${{ github.sha }}
        path: |
          release_notes.md
          CHANGELOG.md
        retention-days: 30

    - name: Display Generated Notes
      run: |
        echo "=== GENERATED RELEASE NOTES ==="
        cat release_notes.md
        echo "==============================="

  update-release:
    name: Update GitHub Release
    runs-on: ubuntu-latest
    needs: generate-release-notes
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download release notes
      uses: actions/download-artifact@v4
      with:
        name: release-notes-${{ github.sha }}
        path: ./notes

    - name: Update GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: ./notes/release_notes.md
        files: |
          ./notes/release_notes.md
          ./notes/CHANGELOG.md

  commit-changelog:
    name: Commit CHANGELOG Updates
    runs-on: ubuntu-latest
    needs: generate-release-notes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download generated files
      uses: actions/download-artifact@v4
      with:
        name: release-notes-${{ github.sha }}
        path: ./

    - name: Commit updated CHANGELOG
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add CHANGELOG.md
        git commit -m "docs: update CHANGELOG for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
        git push

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: generate-release-notes
    if: always()
    
    steps:
    - name: Workflow Status
      run: |
        if ${{ needs.generate-release-notes.result == 'success' }}; then
          echo "🎉 Release notes generated successfully!"
          echo "View artifacts in the workflow run to see the generated notes."
        else
          echo "❌ Release notes generation failed"
          exit 1
        fi
