name: Automated Release Notes Generator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate notes for'
        required: true
        default: 'v1.0.0'

jobs:
  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Release Notes
      run: |
        # Set version
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi

        echo "Generating release notes for version: $VERSION"

        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          COMMIT_RANGE="HEAD"
          echo "No previous tags found, using all commits"
        else
          COMMIT_RANGE="$LATEST_TAG..HEAD"
          echo "Comparing changes from $LATEST_TAG to $VERSION"
        fi

        # Get commit messages
        COMMITS=$(git log "$COMMIT_RANGE" --oneline --format="- %s" 2>/dev/null || echo "- No commits found")

        # Count commits
        COMMIT_COUNT=$(git rev-list --count "$COMMIT_RANGE" 2>/dev/null || echo "0")

        # Create release notes
        cat > release_notes.md << EOF
# Release $VERSION

## Overview
- **Total Commits**: $COMMIT_COUNT
- **Generated**: $(date)
- **Workflow**: $GITHUB_WORKFLOW

## Changes
$COMMITS

## Links
- **Repository**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
- **Workflow Run**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

*Automatically generated by GitHub Actions*
EOF

        echo "✅ Release notes generated successfully!"

    - name: Upload Release Notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release_notes.md
        retention-days: 30

    - name: Display Results
      run: |
        echo "=== GENERATED RELEASE NOTES ==="
        cat release_notes.md
        echo "==============================="

  success-notification:
    name: Success Notification
    runs-on: ubuntu-latest
    needs: generate-release-notes
    if: success()
    
    steps:
    - name: Print Success Message
      run: echo "🎉 Release notes generated successfully! Check artifacts to download."
