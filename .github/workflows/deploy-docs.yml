name: Deploy Documentation

on:
  push:
    branches:
      - main  # run when you push to main

permissions:
  contents: write  # allow push to gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate documentation site
        run: |
          mkdir -p public
          echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Heavens Above Docs</title></head><body>" > public/index.html
          echo "<article style='max-width:800px;margin:auto;font-family:sans-serif;line-height:1.6'>" >> public/index.html
          npx marked README.md >> public/index.html
          echo "</article></body></html>" >> public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
