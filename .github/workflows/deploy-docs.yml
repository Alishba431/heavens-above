name: Deploy Documentation

on:
  push:
    branches:
      - main  # or your default branch

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for static site tools)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install documentation generator
        run: |
          npm install -g markdown-to-html-cli

      - name: Generate HTML from Markdown
        run: |
          mkdir -p docs
          markdown-to-html README.md -o docs/index.html
          echo "<meta http-equiv='refresh' content='0; url=docs/index.html'>" > index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
