name: Documentation Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build Project Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Generate Static Documentation
        run: |
          echo "📘 Generating documentation site..."
          mkdir -p docs-site

          # Create a simple index.html documentation page
          cat > docs-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Heavens Above - Project Documentation</title>
              <style>
                  body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6; }
                  h1, h2 { color: #2c3e50; }
                  a { color: #0366d6; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  footer { margin-top: 40px; font-size: 0.9em; color: #555; }
              </style>
          </head>
          <body>
              <h1>Heavens Above - Documentation</h1>
              <p>This page contains the latest generated documentation for the Heavens Above project.</p>
              <hr>
              <h2>Overview</h2>
              <p>The project gathers astronomical data from multiple sources and structures it for analysis or display.</p>

              <h2>Project Files</h2>
              <ul>
          EOF

          # Add markdown files as links
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./docs-site/*" | while read file; do
            filename=$(basename "$file")
            echo "<li><a href=\"$filename\">$filename</a></li>" >> docs-site/index.html
            cp "$file" "docs-site/$filename"
          done

          cat >> docs-site/index.html <<'EOF'
              </ul>
              <footer>
                  <p>Last updated: $(date)</p>
              </footer>
          </body>
          </html>
          EOF

          echo "✅ Documentation site built successfully."

      - name: Upload Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Documentation
        id: deployment
        uses: actions/deploy-pages@v4

  validate-docs:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Markdown Files
        run: |
          echo "🔍 Validating documentation files..."
          MD_COUNT=$(find . -name "*.md" -not -path "./node_modules/*" | wc -l)
          if [ "$MD_COUNT" -eq 0 ]; then
            echo "⚠️ No markdown files found in repository."
          else
            echo "✅ Found $MD_COUNT markdown files:"
            find . -name "*.md" -not -path "./node_modules/*" -exec echo " - {}" \;
          fi
